<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>StarMeet｜回饋與成長</title><style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#312a3c;background:#f7f5fa}*{box-sizing:border-box}main{max-width:1100px;margin:auto;padding:32px 20px}section,article{background:white;border:1px solid #e1dbe9;border-radius:16px;padding:20px;margin:18px 0}input,select,button{font:inherit;padding:10px;border:1px solid #c9bfd5;border-radius:8px}input[type=password]{width:min(100%,460px)}button{cursor:pointer;background:#79519a;color:white}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7e1ed}.scroll{overflow-x:auto}.content{white-space:pre-wrap;overflow-wrap:anywhere}small,.hint{color:#74677f}a{color:#79519a}#error{color:#a32042}nav{display:flex;gap:20px;flex-wrap:wrap}.meta{font-size:13px;color:#74677f;overflow-wrap:anywhere}label{margin-right:10px}#tickets:empty::after{content:'目前沒有載入回饋。'}@media(max-width:600px){th,td{padding:7px}section,article{padding:14px}}
</style></head><body><main><nav><a href="/admin">原管理頁</a><a href="/support">使用者支援頁</a></nav><h1>回饋與成長數據</h1><p>以帳號關聯首開與伺服器確認回覆計算。未知的回訪日期顯示「觀察中」，不當作零。</p>
<section><label for="token">管理員憑據</label><input id="token" type="password" autocomplete="off" placeholder="X-Admin-Token"><button id="load">載入</button><p class="hint">憑據只用於本次頁面請求，不存入瀏覽器儲存。</p><p id="error" role="status"></p></section>
<section><h2>首聊與回訪</h2><p id="scope" class="hint"></p><div class="scroll"><table><thead><tr><th>首開日期</th><th>已關聯帳號</th><th>首日 5 輪</th><th>次日回聊</th><th>第 7 日回聊</th></tr></thead><tbody id="cohorts"></tbody></table></div><p id="index-state" class="hint"></p></section>
<section><h2>使用者回饋</h2><label for="status">狀態</label><select id="status"><option value="">全部</option><option value="received">已收到</option><option value="investigating">調查中</option><option value="resolved">已處理</option><option value="closed">已結案</option></select><button id="refresh">重新載入</button><div id="tickets"></div><button id="previous">上一頁</button><span id="page"></span><button id="next">下一頁</button></section>
</main><script>
let page=1,total=0;const $=id=>document.getElementById(id);const labels={received:'已收到',investigating:'調查中',resolved:'已處理',closed:'已結案'};
async function api(path,options={}){const response=await fetch('/api/v1/admin/'+path,{...options,headers:{'Content-Type':'application/json','X-Admin-Token':$('token').value,...options.headers},cache:'no-store'});const data=await response.json();if(!response.ok||data.code!==200)throw new Error('讀取失敗，請確認憑據或稍後再試。');return data.data;}
function cell(row,value){const td=document.createElement('td');td.textContent=String(value);row.append(td);}
async function growth(){const data=await api('growth');$('cohorts').replaceChildren();for(const day of data.days){const row=document.createElement('tr');cell(row,day.date);cell(row,day.first_opens);cell(row,day.activated_5_turns);cell(row,day.day1_returned===null?'觀察中':day.day1_returned);cell(row,day.day7_returned===null?'觀察中':day.day7_returned);$('cohorts').append(row);}$('scope').textContent='時區：'+data.timezone+'。僅顯示已關聯帳號的首開；尚未關聯首開 '+data.unlinked_first_opens+'。'+(data.events_truncated?'資料已達單次查詢上限，請縮小範圍或匯出分析。':'');$('index-state').textContent=data.pending_memory_index_jobs===undefined?'':'等待同步的記憶索引：'+data.pending_memory_index_jobs;}
async function feedback(){const data=await api('feedback?page='+page+'&status='+encodeURIComponent($('status').value));total=data.total;$('tickets').replaceChildren();for(const item of data.list){const article=document.createElement('article');const heading=document.createElement('h3');heading.textContent=item.category+' · '+item.feedback_id;const meta=document.createElement('p');meta.className='meta';meta.textContent=item.created_at+' · '+(item.platform||'unknown')+' · '+(item.app_version||'unknown')+' · '+(item.device||'');const content=document.createElement('p');content.className='content';content.textContent=item.content;const contact=document.createElement('p');contact.className='meta';contact.textContent='聯絡：'+(item.contact||'未提供');const select=document.createElement('select');select.setAttribute('aria-label','回饋狀態');for(const [value,label] of Object.entries(labels)){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option);}select.value=item.status;const save=document.createElement('button');save.textContent='儲存狀態';save.onclick=async()=>{save.disabled=true;try{await api('feedback/'+encodeURIComponent(item.feedback_id),{method:'PUT',body:JSON.stringify({status:select.value})});save.textContent='已儲存';}catch(error){$('error').textContent=error.message;}finally{save.disabled=false;}};article.append(heading,meta,content,contact,select,save);$('tickets').append(article);}$('page').textContent=' 第 '+page+' 頁 · '+total+' 筆 ';$('previous').disabled=page<=1;$('next').disabled=page*30>=total;}
async function load(){if(!$('token').value){$('error').textContent='請輸入管理員憑據。';return;}$('error').textContent='';$('load').disabled=true;try{await Promise.all([growth(),feedback()]);}catch(error){$('error').textContent=error.message;}finally{$('load').disabled=false;}}
$('load').onclick=load;$('refresh').onclick=()=>{page=1;load();};$('status').onchange=()=>{page=1;load();};$('previous').onclick=()=>{if(page>1){page--;load();}};$('next').onclick=()=>{if(page*30<total){page++;load();}};
</script></body></html>
