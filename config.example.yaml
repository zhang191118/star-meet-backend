server:
  port: 8080
  mode: debug

jwt:
  jwt_secret: "change-me-in-local-config"
  jwt_expire_hours: 168

database:
  type: mysql
  host: 127.0.0.1
  port: 3306
  database: star_meet
  username: root
  password: "your_database_password"
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: 127.0.0.1
  port: 6379
  password: "your_redis_password"
  db: 0

email:
  host: "smtp.163.com"
  port: 587
  username: "your_email@163.com"
  password: "your_email_password"
  from_name: "星遇 StarMeet"
  from_email: "your_email@163.com"

aliyun:
  qwen:
    api_key: "your-dashscope-api-key"
    model: "qwen3-coder-plus"

mem0:
  host: "https://api.mem0.ai"
  api_key: "your_mem0_api_key"

minimax:
  api_key: "your_minimax_api_key"
  model: "MiniMax-M2.1"

openai_compat:
  base_url: "https://ai98pro.xyz"
  api_key: "your_openai_compatible_api_key"
  model: "grok-4.3-fast"

deepseek:
  api_key: "your_deepseek_api_key"

gemini:
  api_key: "your_gemini_api_key"
  model: "gemini-2.0-flash"

qdrant:
  host: "http://localhost:6333"

oss:
  endpoint: "oss-cn-hangzhou.aliyuncs.com"
  access_key_id: "your_oss_access_key_id"
  access_key_secret: "your_oss_access_key_secret"
  bucket_name: "your_bucket_name"
